name: Supabase keep-alive

# Supabase free projects pause after ~7 days without activity.
# This pings a tiny RPC once a day so the database stays awake.
on:
  schedule:
    - cron: '17 6 * * *' # every day 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call heartbeat()
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured yet, skipping"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/heartbeat" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Heartbeat OK"

name: Weekly backup

# Encrypted backup of the database and uploaded files, kept as a workflow artifact for 90 days.
# Needs repository secrets: SUPABASE_DB_URL, SUPABASE_SERVICE_ROLE_KEY, BACKUP_PASSPHRASE
on:
  schedule:
    - cron: '41 3 * * 0' # Sundays 03:41 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Backup secrets not configured, skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        if: steps.cfg.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          npm ci --ignore-scripts
      - name: Dump database
        if: steps.cfg.outputs.skip != 'true'
        run: |
          mkdir -p backup
          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges --format=custom --file=backup/database.dump
      - name: Download files
        if: steps.cfg.outputs.skip != 'true'
        run: node scripts/backup-storage.mjs
      - name: Encrypt
        if: steps.cfg.outputs.skip != 'true'
        run: |
          tar -czf backup.tar.gz backup
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o backup.tar.gz.gpg backup.tar.gz
          rm -rf backup backup.tar.gz
          echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          name: backup-${{ env.STAMP }}
          path: backup.tar.gz.gpg
          retention-days: 90
